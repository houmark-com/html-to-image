name: 🏷️　Label(Branch Name)
on:
  pull_request_target:
    types: [opened]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: bubkoo/use-app-token@v1
        with:
          app_id: ${{ secrets.APP_ID }}
          private_key: ${{ secrets.PRIVATE_KEY }}
          variable_name: bot_token
      - uses: actions/github-script@v7
        with:
          github-token: ${{ env.bot_token }}
          script: |
            const pr = context.payload.pull_request
            const response = await github.rest.repos.getContent({
              ...context.repo,
              path: '.github/workflows/config/pr-label-branch-name.yml',
              ref: pr.base.sha,
            })
            const config = JSON.parse(Buffer.from(response.data.content, 'base64').toString())
            const labels = Object.entries(config)
              .filter(([, patterns]) => [patterns].flat().some((pattern) =>
                pattern.endsWith('*')
                  ? pr.head.ref.startsWith(pattern.slice(0, -1))
                  : pr.head.ref === pattern,
              ))
              .map(([label]) => label)
            if (labels.length > 0) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels })
            }
