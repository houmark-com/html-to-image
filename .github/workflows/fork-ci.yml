name: Fork verification
on:
  push:
    branches: [houmark]
  pull_request:
    branches: [houmark]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm test
      - name: Report upstream published version
        run: npm view html-to-image version time --json
      - run: npm pack --ignore-scripts
